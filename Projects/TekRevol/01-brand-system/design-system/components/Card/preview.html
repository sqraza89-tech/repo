<!-- @dsCard group="Content" height=300 subtitle="Pillar card, default and featured" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Card preview</title></head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--space-5);padding:var(--space-5);">
  <article class="tr-card tr-card--featured">
    <span class="tr-label">AI-native software</span>
    <h3 class="tr-card__title">Take your AI prototype to production</h3>
    <p class="tr-card__body">Stalled build or a blank page. The same team takes it from first sprint to launch.</p>
    <a class="tr-btn tr-btn--link" href="#">How it works &rarr;</a>
  </article>
  <article class="tr-card">
    <span class="tr-label tr-label--muted">Applied AI</span>
    <h3 class="tr-card__title">Automate the work your team does by hand</h3>
    <p class="tr-card__body">Data entry, customer replies and reporting, handled by AI you can audit.</p>
    <a class="tr-btn tr-btn--link" href="#">See examples &rarr;</a>
  </article>
</div>
</body>
</html>
