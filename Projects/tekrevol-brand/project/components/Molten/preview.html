<!-- @dsCard group="Brand" height=280 subtitle="Molten gradient field with reeded glass and the white logo" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Molten preview</title>
<style>
  .stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-5); padding: var(--space-5); }
  .panel { position: relative; height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .panel img { width: 60%; max-width: 240px; position: relative; }
  .panel .cap { position: absolute; left: var(--space-4); bottom: var(--space-3); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #F3F0EE; opacity: 0.8; }
</style>
</head>
<body>
<div class="stage">
  <div class="panel tr-molten">
    <img src="/_blob/281415bea509bd943081042b312f6179" alt="TekRevol logo, white">
    <span class="cap">Molten field</span>
  </div>
  <div class="panel tr-molten"><div class="tr-reeded" style="position:absolute;inset:0;"></div>
    <img src="/_blob/281415bea509bd943081042b312f6179" alt="TekRevol logo, white">
    <span class="cap">Reeded light</span>
  </div>
</div>
</body>
</html>
